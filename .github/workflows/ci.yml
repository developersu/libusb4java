name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
# linux-x86-64          
         - os: ubuntu-latest
           targetos: linux
           targetarch: amd64
# arm | armhf astr32 armv7l
         - os: ubuntu-24.04-arm
           targetos: linux
           targetarch: armhf
# linux-aarch64
         - os: ubuntu-24.04
           targetos: linux
           targetarch: arm64
# win32-x86-64
         - os: windows-latest
           targetos: win32
           targetarch: x64
# darwin-x86-64
         - os: macos-15-intel
           targetos: apple
           targetarch: amd64
# darwin-arm-64
         - os: macos-14
           targetos: apple
           targetarch: arm64

    steps:
    - uses: actions/checkout@v7
    - name: Set up JDK
      uses: actions/setup-java@v5
      with:
        distribution: jetbrains
        java-version: 25

    - name: Install dependencies
      run: bash ci/deps_${{ matrix.targetos }}.sh

    - name: Build artifacts
      run: mkdir build && cd build && cmake .. && cmake --build . --config Release && cd .. && jshell ci/mk-artifact.jsh

    - uses: actions/upload-artifact@v7
      with:
        name: ${{ matrix.targetos }}-${{ matrix.targetarch }}
        path: publish/*
