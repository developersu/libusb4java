name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
# linux-x86-64          
         - os: ubuntu-latest
           targetos: linux
           targetarch: x86-64
## windows arm
#         - os: windows-11-arm
#           targetos: win32
#           targetarch: aarch64
## arm | armhf astr32 armv7l
#         - os: ubuntu-24.04-arm
#           targetos: linux
#           targetarch: armhf
## linux-aarch64
#         - os: ubuntu-24.04-arm
#           targetos: linux
#           targetarch: aarch64
## win32-x86-64
#         - os: windows-latest
#           targetos: win32
#           targetarch: x86-64
## darwin-x86-64
#         - os: macos-15-intel
#           targetos: darwin
#           targetarch: x86-64
## darwin-arm-64
#         - os: macos-14
#           targetos: darwin
#           targetarch: aarch64

    steps:
    - uses: actions/checkout@v7
    - name: Set up JDK
      uses: actions/setup-java@v5
      with:
        distribution: jetbrains
        java-version: 25

    - name: Install dependencies
      run: bash printenv
