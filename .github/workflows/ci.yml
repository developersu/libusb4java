name: CI

on:
  push:
    branches: [ master, ci ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
## windows arm
#         - os: windows-11-arm
#           targetos: win32
#           targetarch: aarch64
#           ext: dll
## win32-x86-64
#         - os: windows-latest
#           targetos: win32
#           targetarch: x86-64
#           ext: dll
# linux-x86-64          
         - os: ubuntu-latest
           target: linux-x86-64
           ext: so
## arm | armhf astr32 armv7l
#         - os: ubuntu-24.04-arm
#           targetos: linux
#           targetarch: armhf
#           ext: so
## linux-aarch64
#         - os: ubuntu-24.04-arm
#           targetos: linux
#           targetarch: aarch64
#           ext: so
## darwin-x86-64
#         - os: macos-15-intel
#           targetos: darwin
#           targetarch: x86-64
#           ext: dylib
## darwin-arm-64
#         - os: macos-14
#           targetos: darwin
#           targetarch: aarch64
#           ext: dylib

    steps:
    - uses: actions/checkout@v7
    - name: Set up JDK
      uses: actions/setup-java@v5
      with:
        distribution: jetbrains
        java-version: 25

    - name: Install dependencies
      run: bash ci/deps_${{ matrix.ext }}.sh

    - name: Build artifacts
      run: >-
        mkdir build && 
        cd build && 
        cmake .. && 
        cmake --build . --config Release && 
        cd .. && 
        mkdir -p publish/org/usb4java/${{ matrix.target }} &&
        (mv build/src/*usb4java.${{ matrix.ext }}         publish/org/usb4java/${{ matrix.target }}/libusb4java.$${{ matrix.ext }} |
         mv build/src/Release/*usb4java.${{ matrix.ext }} publish/org/usb4java/${{ matrix.target }}/libusb4java.$${{ matrix.ext }}) &&
        cd publish &&
        jar cf ./libusb4java-1.0.30-${{ matrix.target }}.jar *

    - uses: actions/upload-artifact@v7
      with:
        path: publish/libusb4java-1.0.30-bundle.jar
